<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Little Sorry Letter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbe3ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: pink gingham tabletop -> sealed envelope with a bow -> tap -> ruled stationery letter with a kitten peeking over the top edge. One deliberate stationery look, same in light and dark. */
:root {
  --table: #fbe3ea;          /* gingham base */
  --check: rgba(232, 92, 122, .07);
  --paper: #fffafa;
  --rule: #f6d3dc;
  --margin: #f3a9ba;
  --ink: #4a2a33;            /* soft plum-brown text */
  --ink-soft: #8c6670;
  --bow: #e2384f;            /* ribbon red */
  --bow-deep: #b8233a;
  --blush: #ffb8c6;
  --envelope: #fff4f6;
  --envelope-shade: #f9dbe3;
  --display: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", ui-rounded, system-ui, sans-serif;
  --hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  --line: 2rem;
  color-scheme: light;
}

* { box-sizing: border-box; }
/* Without this, display:grid/flex below beats the hidden attribute and the envelope/letter never hide. */
[hidden] { display: none !important; }
html, body { min-height: 100%; }
html { overflow-x: hidden; } /* tilted/flipping items never make the page wobble sideways */
body {
  margin: 0;
  background-color: var(--table);
  background-image:
    repeating-linear-gradient(0deg, var(--check) 0 18px, transparent 18px 36px),
    repeating-linear-gradient(90deg, var(--check) 0 18px, transparent 18px 36px);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 500;
  font-size: 17px;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(28px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}

.stage {
  max-width: 34rem;
  margin: 0 auto;
  display: grid;
  gap: 22px;
  justify-items: center;
}

/* ---------- Envelope ---------- */
.envelope-wrap { display: grid; gap: 20px; justify-items: center; width: 100%; padding-top: 6vh; }
.to-line {
  font-family: var(--hand);
  font-size: 1.9rem;
  color: var(--bow-deep);
  text-align: center;
  text-wrap: balance;
  margin: 0;
}
.envelope {
  position: relative;
  width: min(100%, 340px);
  aspect-ratio: 3 / 2;
  max-width: 100%;
  border: 0;
  padding: 0;
  background: var(--envelope);
  border-radius: 14px;
  box-shadow: 0 18px 40px -18px rgba(184, 35, 58, .45), 0 2px 0 var(--envelope-shade);
  cursor: pointer;
  perspective: 900px;
  font: inherit;
  color: inherit;
  transform: rotate(-1.5deg);
}
.postmark {
  position: absolute; top: 12px; right: 14px; z-index: 3;
  width: 64px; height: 64px; border-radius: 50%;
  border: 1.5px dashed var(--margin);
  display: grid; place-items: center; text-align: center;
  font-family: var(--hand); font-size: .95rem; line-height: 1;
  color: var(--bow-deep);
  transform: rotate(12deg);
  transition: opacity .25s ease;
}
.env-sprig { position: absolute; left: 10px; bottom: 6px; width: 84px; z-index: 3; }
.opening .postmark { opacity: 0; }
.envelope:focus-visible { outline: 3px solid var(--bow); outline-offset: 6px; }
.envelope::before { /* bottom folds */
  content: "";
  position: absolute; inset: 0;
  border-radius: 14px;
  background:
    linear-gradient(to top right, var(--envelope-shade) 49.5%, transparent 50%) left bottom / 50.5% 100% no-repeat,
    linear-gradient(to top left, var(--envelope-shade) 49.5%, transparent 50%) right bottom / 50.5% 100% no-repeat;
  opacity: .7;
}
.flap {
  position: absolute; left: 0; right: 0; top: 0;
  height: 58%;
  background: #fde9ee;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  border-radius: 14px 14px 0 0;
  transform-origin: top center;
  transition: transform .6s cubic-bezier(.5, 0, .2, 1);
  z-index: 2;
  filter: drop-shadow(0 2px 0 var(--envelope-shade));
}
.seal {
  position: absolute; left: 50%; top: 58%;
  width: 66px; transform: translate(-50%, -50%);
  z-index: 3;
  transition: opacity .25s ease;
}
.tap-hint {
  font-size: .95rem;
  color: var(--ink-soft);
  letter-spacing: .04em;
  margin: 0;
}
.opening .flap { transform: rotateX(180deg); }
.opening .seal { opacity: 0; }

.paper-sprig { position: absolute; pointer-events: none; }
.paper-sprig.top { top: -20px; right: -12px; width: 92px; transform: rotate(8deg); }
.paper-sprig.bottom { bottom: 14px; right: 12px; width: 70px; transform: scaleX(-1) rotate(-6deg); opacity: .9; }
.date {
  margin: 0; text-align: right;
  font-family: var(--hand); font-size: 1.35rem; color: var(--ink-soft);
}

/* ---------- Letter ---------- */
.letter-wrap { width: 100%; display: grid; justify-items: center; gap: 22px; }
.letter-wrap.show { animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(30px) rotate(-1deg); } to { opacity: 1; transform: none; } }

.kitty { width: 132px; margin-bottom: -46px; position: relative; z-index: 2; }

.paper {
  position: relative;
  width: 100%;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 2.6rem, var(--margin) 2.6rem, var(--margin) calc(2.6rem + 1.5px), transparent calc(2.6rem + 1.5px)),
    repeating-linear-gradient(180deg, transparent 0 calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px) var(--line));
  background-position: 0 0, 0 1.1rem;
  border-radius: 18px;
  box-shadow: 0 24px 50px -24px rgba(184, 35, 58, .45), 0 0 0 1px rgba(226, 56, 79, .08);
  padding: 3.4rem 1.4rem 2rem 3.4rem;
  line-height: var(--line);
}
.paper::after { /* scalloped bottom edge */
  content: "";
  position: absolute; left: 14px; right: 14px; bottom: -9px; height: 10px;
  background: radial-gradient(circle at 9px 0, var(--paper) 9px, transparent 9.5px) 0 0 / 18px 10px repeat-x;
}

h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.9rem, 8vw, 2.5rem);
  line-height: 1.15;
  color: var(--bow);
  margin: 0 0 .2rem;
  text-wrap: balance;
}
.subtitle { margin: 0 0 var(--line); color: var(--ink-soft); font-size: .95rem; }
.greeting { font-family: var(--hand); font-size: 1.75rem; margin: 0 0 .25rem; color: var(--ink); }
.paper p.body { margin: 0 0 var(--line); text-wrap: pretty; }

.promises-title {
  font-family: var(--display); font-weight: 400;
  font-size: .95rem; letter-spacing: .06em;
  color: var(--bow-deep);
  margin: 0;
}
.promises { list-style: none; margin: 0 0 var(--line); padding: 0; }
.promises li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.promises li svg { width: 16px; margin-top: .55rem; }

.closing { margin: 0; }
.signoff { font-family: var(--hand); font-size: 1.6rem; margin: var(--line) 0 0; }
.from { font-family: var(--hand); font-size: 2.2rem; color: var(--bow); margin: 0; }

/* ---------- Gentle question ---------- */
.ask {
  width: 100%;
  background: var(--paper);
  border-radius: 999px 999px 24px 24px;
  padding: 1.4rem 1.2rem 1.4rem;
  display: grid; gap: 14px; justify-items: center; text-align: center;
  box-shadow: 0 14px 30px -20px rgba(184, 35, 58, .5);
}
.ask h2 { font-family: var(--display); font-weight: 400; font-size: 1.25rem; margin: 0; color: var(--ink); text-wrap: balance; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn {
  font: inherit; font-weight: 700; font-size: 1rem;
  min-height: 48px; padding: 0 22px;
  border-radius: 999px; cursor: pointer;
  border: 2px solid var(--bow);
  transition: transform .15s ease;
  touch-action: manipulation;
}
.btn:active { transform: scale(.96); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn.primary { background: var(--bow); color: #fff; }
.btn.quiet { background: transparent; color: var(--bow-deep); }.reply { margin: 0; font-family: var(--hand); font-size: 1.55rem; color: var(--bow-deep); line-height: 1.3; text-wrap: balance; }

.reread { background: none; border: 0; font: inherit; font-size: .9rem; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px; }

/* ---------- Polaroid ---------- */
.polaroid {
  position: relative; margin: 6px 0 0;
  width: min(78%, 260px); max-width: 100%;
  background: #fff; padding: 12px 12px 10px;
  box-shadow: 0 18px 34px -18px rgba(74, 42, 51, .45);
  transform: rotate(-3deg);
  display: grid; gap: 6px;
}
.polaroid::before { /* washi tape */
  content: ""; position: absolute; top: -12px; left: 50%;
  width: 92px; height: 24px; background: rgba(255, 184, 198, .75);
  transform: translateX(-50%) rotate(2deg);
}
.polaroid img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: 50% 30%; background: var(--rule); }
.polaroid figcaption { font-family: var(--hand); font-size: 1.45rem; text-align: center; color: var(--ink); line-height: 1.2; }
.letter-wrap.show .polaroid { animation: drop .9s .35s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-40px) rotate(-12deg); } to { opacity: 1; transform: rotate(-3deg); } }

/* ---------- Song ---------- */
.song {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 0 20px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--bow);
  color: var(--bow-deep); font-weight: 700; text-decoration: none;
  max-width: 100%;
}
.song svg { width: 18px; flex: none; fill: currentColor; }
.song span { min-width: 0; overflow-wrap: anywhere; }
.song:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* ---------- Extra sections ---------- */
.section-card {
  width: 100%; background: var(--paper); border-radius: 20px;
  padding: 1.4rem 1.2rem;
  box-shadow: 0 14px 30px -20px rgba(184, 35, 58, .5);
  display: grid; gap: 14px;
}
.section-card h2 { font-family: var(--display); font-weight: 400; font-size: 1.2rem; color: var(--bow); margin: 0; }
.section-card .sub { margin: -8px 0 0; color: var(--ink-soft); font-size: .9rem; }

.things { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.thing { border: 0; padding: 0; background: none; font: inherit; color: inherit; cursor: pointer; perspective: 700px; min-width: 0; touch-action: manipulation; }
.thing:focus-visible { outline: 3px solid var(--bow); outline-offset: 3px; border-radius: 14px; }
.thing-inner {
  position: relative; display: grid; min-height: 120px;
  transition: transform .55s cubic-bezier(.4, .2, .2, 1);
  transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
}
.thing.flipped .thing-inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; border-radius: 14px; padding: 12px;
  display: grid; place-items: center; align-content: center; gap: 6px; text-align: center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.face.front { background: #fdeef2; border: 1.5px dashed var(--margin); color: var(--bow-deep); font-family: var(--hand); font-size: 1.3rem; }
.face.front svg { width: 28px; }
.face.back { background: #fff; border: 1.5px solid var(--rule); transform: rotateY(180deg); font-size: .95rem; line-height: 1.4; overflow-wrap: anywhere; }

.moments { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; position: relative; }
.moments::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; border-left: 2px dashed var(--margin); }
.moments li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start; position: relative; }
.moments li svg { width: 24px; background: var(--paper); border-radius: 50%; }
.m-date { display: block; font-family: var(--hand); font-size: 1.35rem; color: var(--bow-deep); line-height: 1.1; }
.m-text { display: block; line-height: 1.5; }

/* ---------- Her message (pinned screenshot) ---------- */
.pinned {
  position: relative; margin: 10px 0 0;
  width: min(88%, 320px); max-width: 100%;
  background: #fff; padding: 10px 10px 12px; border-radius: 6px;
  box-shadow: 0 18px 34px -18px rgba(74, 42, 51, .45);
  transform: rotate(1.5deg);
  display: grid; gap: 8px;
}
.pinned::before { /* washi tape */
  content: ""; position: absolute; top: -12px; left: 50%;
  width: 96px; height: 24px; background: rgba(169, 201, 164, .7);
  transform: translateX(-50%) rotate(-3deg);
}
.pinned img { display: block; width: 100%; height: auto; border-radius: 4px; }
.pinned figcaption { font-family: var(--hand); font-size: 1.5rem; text-align: center; color: var(--bow-deep); line-height: 1.2; text-wrap: balance; }

@media (max-width: 380px) {
  .paper { padding-left: 2.6rem; padding-right: 1rem; background-image:
    linear-gradient(90deg, transparent 1.8rem, var(--margin) 1.8rem, var(--margin) calc(1.8rem + 1.5px), transparent calc(1.8rem + 1.5px)),
    repeating-linear-gradient(180deg, transparent 0 calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px) var(--line)); }
}
@media (prefers-reduced-motion: reduce) {
  .flap, .seal, .postmark { transition: none; }
  .letter-wrap.show, .letter-wrap.show .polaroid { animation: none; }
  .thing-inner { transition: none; }
}
</style>
</head>
<body>

<!-- Reusable bow drawing -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bow" viewBox="0 0 100 64">
      <path d="M50 32 C38 12 14 2 6 10 C-2 20 4 50 16 56 C28 62 42 44 50 32Z" fill="#e2384f"/>
      <path d="M50 32 C62 12 86 2 94 10 C102 20 96 50 84 56 C72 62 58 44 50 32Z" fill="#e2384f"/>
      <path d="M50 32 C40 22 24 16 18 22 C14 28 20 42 28 44" fill="none" stroke="#b8233a" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <path d="M50 32 C60 22 76 16 82 22 C86 28 80 42 72 44" fill="none" stroke="#b8233a" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <ellipse cx="50" cy="32" rx="11" ry="12" fill="#c92a42"/>
      <ellipse cx="47" cy="28" rx="4" ry="3" fill="#fff" opacity=".35"/>
    </symbol>
    <symbol id="flower" viewBox="0 0 40 40">
      <g fill="#ffc9d5"><circle cx="20" cy="10" r="7.5"/><circle cx="29.5" cy="17" r="7.5"/><circle cx="26" cy="28" r="7.5"/><circle cx="14" cy="28" r="7.5"/><circle cx="10.5" cy="17" r="7.5"/></g>
      <circle cx="20" cy="20" r="4.5" fill="#f4c55e"/>
    </symbol>
    <symbol id="flower-white" viewBox="0 0 40 40">
      <g fill="#fff" stroke="#f3a9ba" stroke-width="1.5"><circle cx="20" cy="10" r="7"/><circle cx="29.5" cy="17" r="7"/><circle cx="26" cy="28" r="7"/><circle cx="14" cy="28" r="7"/><circle cx="10.5" cy="17" r="7"/></g>
      <circle cx="20" cy="20" r="4.5" fill="#f4c55e"/>
    </symbol>
    <symbol id="sprig" viewBox="0 0 120 80">
      <path d="M10 74 C40 60 70 44 108 14" fill="none" stroke="#a9c9a4" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="40" cy="56" rx="10" ry="4.5" fill="#bcd8b6" transform="rotate(-35 40 56)"/>
      <ellipse cx="70" cy="44" rx="10" ry="4.5" fill="#bcd8b6" transform="rotate(25 70 44)"/>
      <use href="#flower" x="88" y="0" width="30" height="30"/>
      <use href="#flower-white" x="52" y="20" width="24" height="24"/>
      <use href="#flower" x="18" y="46" width="20" height="20"/>
    </symbol>
  </defs>
</svg>

<main class="stage">
  <!-- Envelope screen -->
  <section class="envelope-wrap" id="envelopeView">
    <p class="to-line" id="envelopeNote"></p>
    <button class="envelope" id="envelope" type="button" aria-label="Open the letter">
      <span class="flap"></span>
      <span class="postmark" id="postmark" aria-hidden="true"></span>
      <svg class="seal" viewBox="0 0 100 64" aria-hidden="true"><use href="#bow"/></svg>
      <svg class="env-sprig" viewBox="0 0 120 80" aria-hidden="true"><use href="#sprig"/></svg>
    </button>
    <p class="tap-hint">tap the envelope to open</p>
  </section>

  <!-- Letter screen -->
  <section class="letter-wrap" id="letterView" hidden>
    <!-- Original sorry-kitten drawing: white kitten, red bow, closed eyes, tiny tear, paws on the paper edge -->
    <svg class="kitty" viewBox="0 0 160 130" aria-hidden="true">
      <path d="M30 40 L26 6 L60 26Z" fill="#fff" stroke="#4a2a33" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M130 40 L134 6 L100 26Z" fill="#fff" stroke="#4a2a33" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M34 34 L32 16 L50 27Z" fill="#ffd3dc"/>
      <path d="M126 34 L128 16 L110 27Z" fill="#ffd3dc"/>
      <ellipse cx="80" cy="66" rx="60" ry="46" fill="#fff" stroke="#4a2a33" stroke-width="3.5"/>
      <!-- closed, apologetic eyes -->
      <path d="M52 66 Q58 72 64 66" fill="none" stroke="#4a2a33" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M96 66 Q102 72 108 66" fill="none" stroke="#4a2a33" stroke-width="3.5" stroke-linecap="round"/>
      <!-- tear -->
      <path d="M110 74 q3 6 0 9 q-3 -3 0 -9Z" fill="#9fd3f0"/>
      <!-- nose -->
      <ellipse cx="80" cy="76" rx="5" ry="3.6" fill="#f4b23e" stroke="#4a2a33" stroke-width="2"/>
      <!-- blush -->
      <ellipse cx="46" cy="82" rx="9" ry="5" fill="#ffb8c6" opacity=".8"/>
      <ellipse cx="114" cy="82" rx="9" ry="5" fill="#ffb8c6" opacity=".8"/>
      <!-- whiskers -->
      <g stroke="#4a2a33" stroke-width="3" stroke-linecap="round">
        <path d="M14 66 L34 70"/><path d="M12 80 L33 79"/>
        <path d="M146 66 L126 70"/><path d="M148 80 L127 79"/>
      </g>
      <!-- paws on the paper edge -->
      <ellipse cx="54" cy="116" rx="15" ry="10" fill="#fff" stroke="#4a2a33" stroke-width="3.5"/>
      <ellipse cx="106" cy="116" rx="15" ry="10" fill="#fff" stroke="#4a2a33" stroke-width="3.5"/>
      <!-- bow on the right ear -->
      <use href="#bow" x="96" y="2" width="54" height="35"/>
    </svg>

    <article class="paper" aria-labelledby="title">
      <svg class="paper-sprig top" viewBox="0 0 120 80" aria-hidden="true"><use href="#sprig"/></svg>
      <svg class="paper-sprig bottom" viewBox="0 0 120 80" aria-hidden="true"><use href="#sprig"/></svg>
      <p class="date" id="date"></p>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
      <p class="greeting" id="greeting"></p>
      <div id="paragraphs"></div>
      <div id="promisesBlock">
        <p class="promises-title" id="promisesTitle"></p>
        <ul class="promises" id="promises"></ul>
      </div>
      <p class="closing" id="closing"></p>
      <p class="signoff" id="signoff"></p>
      <p class="from" id="from"></p>
    </article>

    <figure class="polaroid" id="polaroid" hidden>
      <img id="photo" alt="A photo of us">
      <figcaption id="photoCaption"></figcaption>
    </figure>

    <a class="song" id="song" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v12.3A3.5 3.5 0 1 0 11 18V8h7V3H9z"/></svg>
      <span id="songLabel"></span>
    </a>

    <section class="section-card" id="thingsBlock">
      <h2 id="thingsTitle"></h2>
      <p class="sub">tap a card</p>
      <div class="things" id="things"></div>
    </section>

    <section class="section-card" id="momentsBlock">
      <h2 id="momentsTitle"></h2>
      <ol class="moments" id="moments"></ol>
    </section>

    <figure class="pinned" id="pinned" hidden>
      <img id="messageImg" alt="A message you once sent me">
      <figcaption id="messageCaption"></figcaption>
    </figure>

    <section class="ask" aria-live="polite">
      <h2 id="question"></h2>
      <div class="choices" id="choices">
        <button class="btn primary" id="yesBtn" type="button"></button>
        <button class="btn quiet" id="laterBtn" type="button"></button>
      </div>
      <p class="reply" id="reply" hidden></p>
    </section>

    <button class="reread" id="reread" type="button">close the letter</button>
  </section>
</main>

<script>
/* =====================================================================
   EDIT YOUR LETTER HERE
   Replace everything in [square brackets]. Keep the quotes and commas.
   - Add or remove paragraphs by adding/removing lines in `paragraphs`.
   - Set `promises: []` to hide the little bow list completely.
   ===================================================================== */
const LETTER = {
  envelopeNote: "for Serina, open when you're ready",

  // The day you met. Shows as a postmark on the envelope and at the top of the letter.
  metDate: "04.05.2025",
  dateLine: "since 04.05.2025",

  title: "I'm sorry",
  subtitle: "a small letter, written slowly",

  greeting: "My Dearest Serina,",

  paragraphs: [

/* Counter: counts letter opens and button presses on a free service
   (abacus.jasoncameron.dev). Must match the name in the stats page.
   Open the letter with ?nocount at the end of the link to test it
   yourself without changing the numbers. */
const COUNTER = { namespace: "ll-f05e70606ece00ba" };
/* ===================================================================== */

(function () {
  const $ = (id) => document.getElementById(id);
  const set = (id, text) => { $(id).textContent = text; };

  set("envelopeNote", LETTER.envelopeNote);
  set("postmark", LETTER.metDate);
  set("date", LETTER.dateLine);
  set("title", LETTER.title);
  set("subtitle", LETTER.subtitle);
  set("greeting", LETTER.greeting);
  set("closing", LETTER.closing);
  set("signoff", LETTER.signoff);
  set("from", LETTER.from);
  set("question", LETTER.question);
  set("yesBtn", LETTER.yesLabel);
  set("laterBtn", LETTER.laterLabel);
  document.title = LETTER.title === "I'm sorry" ? "A Little Sorry Letter" : LETTER.title;

  const paras = $("paragraphs");
  LETTER.paragraphs.forEach((t) => {
    const p = document.createElement("p");
    p.className = "body";
    p.textContent = t;
    paras.appendChild(p);
  });

  if (!LETTER.promises || !LETTER.promises.length) {
    $("promisesBlock").hidden = true;
  } else {
    set("promisesTitle", LETTER.promisesTitle);
    const ul = $("promises");
    LETTER.promises.forEach((t) => {
      const li = document.createElement("li");
      li.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true"><use href="#flower"/></svg><span></span>';
      li.querySelector("span").textContent = t;
      ul.appendChild(li);
    });
  }

  // Polaroid: only shows once the photo actually loads
  if (LETTER.photo) {
    const img = $("photo");
    img.addEventListener("load", () => { $("polaroid").hidden = false; });
    img.src = LETTER.photo;
    set("photoCaption", LETTER.photoCaption || "");
  }

  // Her message screenshot: only shows once the image actually loads
  if (LETTER.message) {
    const m = $("messageImg");
    m.addEventListener("load", () => { $("pinned").hidden = false; });
    m.src = LETTER.message;
    set("messageCaption", LETTER.messageCaption || "");
  }

  // Song button
  if (LETTER.songUrl) {
    const a = $("song");
    a.href = LETTER.songUrl;
    set("songLabel", LETTER.songTitle || "our song");
    a.hidden = false;
  }

  // Flip cards
  if (!LETTER.things || !LETTER.things.length) {
    $("thingsBlock").hidden = true;
  } else {
    set("thingsTitle", LETTER.thingsTitle);
    const grid = $("things");
    LETTER.things.forEach((t) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "thing";
      b.setAttribute("aria-pressed", "false");
      b.innerHTML =
        '<span class="thing-inner">' +
          '<span class="face front"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#flower"/></svg>tap</span>' +
          '<span class="face back"></span>' +
        '</span>';
      b.querySelector(".back").textContent = t;
      b.setAttribute("aria-label", t);
      b.addEventListener("click", () => {
        const on = b.classList.toggle("flipped");
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      grid.appendChild(b);
    });
  }

  // Moments timeline
  if (!LETTER.moments || !LETTER.moments.length) {
    $("momentsBlock").hidden = true;
  } else {
    set("momentsTitle", LETTER.momentsTitle);
    const ol = $("moments");
    LETTER.moments.forEach((m) => {
      const li = document.createElement("li");
      li.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true"><use href="#flower"/></svg><span><span class="m-date"></span><span class="m-text"></span></span>';
      li.querySelector(".m-date").textContent = m.date;
      li.querySelector(".m-text").textContent = m.text;
      ol.appendChild(li);
    });
  }

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const envView = $("envelopeView");
  const letterView = $("letterView");

  function openLetter() {
    envView.classList.add("opening");
    setTimeout(() => {
      envView.hidden = true;
      envView.classList.remove("opening");
      letterView.hidden = false;
      letterView.classList.add("show");
      window.scrollTo(0, 0);
    }, reduce ? 0 : 650);
  }
  function closeLetter() {
    letterView.hidden = true;
    letterView.classList.remove("show");
    envView.hidden = false;
    window.scrollTo(0, 0);
  }
  function answer(text) {
    $("choices").hidden = true;
    const r = $("reply");
    r.textContent = text;
    r.hidden = false;
  }

  const counting = !/nocount/.test(location.search);
  // Counts one press. If the free service is busy ("too many requests"),
  // it tries again a few times so the press isn't lost.
  function count(key, attempt = 0) {
    if (!counting) return;
    try {
      fetch("https://abacus.jasoncameron.dev/hit/" + COUNTER.namespace + "/" + key, { keepalive: true })
        .then((res) => {
          if ((res.status === 429 || res.status >= 500) && attempt < 4) {
            setTimeout(() => count(key, attempt + 1), 3000 * (attempt + 1));
          }
        })
        .catch(() => { if (attempt < 4) setTimeout(() => count(key, attempt + 1), 3000 * (attempt + 1)); });
    } catch (e) { /* never let counting break the letter */ }
  }

  let openedOnce = false;
  $("envelope").addEventListener("click", () => {
    if (!openedOnce) { openedOnce = true; count("opened"); }
    openLetter();
  });
  $("reread").addEventListener("click", closeLetter);
  $("yesBtn").addEventListener("click", () => { count("ready"); answer(LETTER.yesReply); });
  $("laterBtn").addEventListener("click", () => { count("notyet"); answer(LETTER.laterReply); });
})();
</script>
</body>
