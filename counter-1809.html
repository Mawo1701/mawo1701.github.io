<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Letter Counter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root {
  --table: #fbe3ea; --check: rgba(232, 92, 122, .07);
  --paper: #fffafa; --ink: #4a2a33; --ink-soft: #8c6670;
  --bow: #e2384f; --bow-deep: #b8233a; --line: #f6d3dc;
  --display: "Mochiy Pop One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Zen Maru Gothic", ui-rounded, system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--table);
  background-image:
    repeating-linear-gradient(0deg, var(--check) 0 18px, transparent 18px 36px),
    repeating-linear-gradient(90deg, var(--check) 0 18px, transparent 18px 36px);
  color: var(--ink); font-family: var(--body); font-weight: 500; font-size: 17px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(40px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}
.card {
  max-width: 26rem; margin: 0 auto; background: var(--paper);
  border-radius: 20px; padding: 24px 22px;
  box-shadow: 0 24px 50px -24px rgba(184, 35, 58, .45);
  display: grid; gap: 18px;
}
h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--bow); margin: 0; }
.rows { display: grid; gap: 0; }
.row {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 12px;
  padding: 14px 0; border-bottom: 1.5px dashed var(--line);
}
.row:last-child { border-bottom: 0; }
.label { font-weight: 700; }
.hint { display: block; font-size: .85rem; color: var(--ink-soft); font-weight: 500; }
.num { font-family: var(--display); font-size: 2rem; color: var(--bow-deep); font-variant-numeric: tabular-nums; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.status { margin: 0; font-size: .85rem; color: var(--ink-soft); }
button {
  font: inherit; font-weight: 700; min-height: 44px; padding: 0 20px;
  border-radius: 999px; border: 2px solid var(--bow); background: var(--bow); color: #fff; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button.ghost { background: transparent; color: var(--bow-deep); }
button:disabled { opacity: .6; cursor: default; }
.reset { display: grid; gap: 10px; justify-items: start; padding-top: 14px; border-top: 1.5px dashed var(--line); }
.reset p { margin: 0; font-size: .9rem; color: var(--ink-soft); }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; }
</style>
</head>
<body>
<main class="card">
  <h1>Letter counter</h1>
  <div class="rows">
    <div class="row"><span class="label">Letter opened<span class="hint">times the envelope was tapped open</span></span><span class="num" id="opened">–</span></div>
    <div class="row"><span class="label">"I'm ready to talk"<span class="hint">times this button was pressed</span></span><span class="num" id="ready">–</span></div>
    <div class="row"><span class="label">"Not yet"<span class="hint">times this button was pressed</span></span><span class="num" id="notyet">–</span></div>
  </div>
  <div class="foot">
    <p class="status" id="status">Loading…</p>
    <button type="button" id="refresh">Refresh</button>
  </div>
  <div class="reset">
    <button type="button" class="ghost" id="resetBtn">Reset counter</button>
    <div id="confirmBox" hidden>
      <p>Set all three numbers back to 0? This can't be undone.</p>
      <div class="confirm">
        <button type="button" id="confirmYes">Yes, reset to 0</button>
        <button type="button" class="ghost" id="confirmNo">Cancel</button>
      </div>
    </div>
  </div>
</main>
<script>
// Must match COUNTER.namespace in index.html
const NAMESPACE = "ll-f05e70606ece00ba";
const KEYS = ["opened", "ready", "notyet"];
// Reset keys for each counter (made when the counters were created)
const RESET_KEYS = {
  opened: "cdd3b192-6b39-4c77-b7d4-9231ecae2efd",
  ready:  "c00caa5b-8574-44d7-9b41-d395b322c5fc",
  notyet: "137df513-8210-4bc5-9079-800608216c53"
};

async function getCount(key) {
  const res = await fetch("https://abacus.jasoncameron.dev/get/" + NAMESPACE + "/" + key, { cache: "no-store" });
  if (res.status === 404) return 0;               // never counted yet
  if (res.status === 429) throw new Error("busy");  // too many requests right now
  if (!res.ok) throw new Error("down");
  const data = await res.json();
  if (data.error) throw new Error("down");
  return Number(data.value) || 0;
}

async function load() {
  const status = document.getElementById("status");
  status.textContent = "Loading…";
  try {
    const values = await Promise.all(KEYS.map(getCount));
    KEYS.forEach((k, i) => { document.getElementById(k).textContent = values[i]; });
    status.textContent = "Checked " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    KEYS.forEach((k) => { document.getElementById(k).textContent = "–"; });
    status.textContent = e.message === "busy"
      ? "Counter is busy. Wait 10 seconds, then tap Refresh."
      : "Couldn't reach the counter. Try again in a minute.";
  }
}

async function resetOne(key) {
  const res = await fetch("https://abacus.jasoncameron.dev/reset/" + NAMESPACE + "/" + key, {
    method: "POST",
    headers: { Authorization: "Bearer " + RESET_KEYS[key] }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error || "reset failed");
}

const resetBtn = document.getElementById("resetBtn");
const confirmBox = document.getElementById("confirmBox");
const confirmYes = document.getElementById("confirmYes");

resetBtn.addEventListener("click", () => { resetBtn.hidden = true; confirmBox.hidden = false; });
document.getElementById("confirmNo").addEventListener("click", () => { confirmBox.hidden = true; resetBtn.hidden = false; });
confirmYes.addEventListener("click", async () => {
  const status = document.getElementById("status");
  confirmYes.disabled = true;
  status.textContent = "Resetting…";
  try {
    await Promise.all(KEYS.map(resetOne));
    await load();
    status.textContent = "Reset to 0 at " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    status.textContent = "Reset didn't work. Try again in a bit.";
  }
  confirmYes.disabled = false;
  confirmBox.hidden = true;
  resetBtn.hidden = false;
});

document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
