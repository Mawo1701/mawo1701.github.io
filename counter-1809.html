<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Letter Counter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root {
  --table: #fbe3ea; --check: rgba(232, 92, 122, .07);
  --paper: #fffafa; --ink: #4a2a33; --ink-soft: #8c6670;
  --bow: #e2384f; --bow-deep: #b8233a; --line: #f6d3dc;
  --display: "Mochiy Pop One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Zen Maru Gothic", ui-rounded, system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--table);
  background-image:
    repeating-linear-gradient(0deg, var(--check) 0 18px, transparent 18px 36px),
    repeating-linear-gradient(90deg, var(--check) 0 18px, transparent 18px 36px);
  color: var(--ink); font-family: var(--body); font-weight: 500; font-size: 17px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(40px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}
.card {
  max-width: 26rem; margin: 0 auto; background: var(--paper);
  border-radius: 20px; padding: 24px 22px;
  box-shadow: 0 24px 50px -24px rgba(184, 35, 58, .45);
  display: grid; gap: 18px;
}
h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--bow); margin: 0; }
.rows { display: grid; gap: 0; }
.row {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 12px;
  padding: 14px 0; border-bottom: 1.5px dashed var(--line);
}
.row:last-child { border-bottom: 0; }
.label { font-weight: 700; }
.hint { display: block; font-size: .85rem; color: var(--ink-soft); font-weight: 500; }
.num { font-family: var(--display); font-size: 2rem; color: var(--bow-deep); font-variant-numeric: tabular-nums; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.status { margin: 0; font-size: .85rem; color: var(--ink-soft); }
button {
  font: inherit; font-weight: 700; min-height: 44px; padding: 0 20px;
  border-radius: 999px; border: 2px solid var(--bow); background: var(--bow); color: #fff; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main class="card">
  <h1>Letter counter</h1>
  <div class="rows">
    <div class="row"><span class="label">Letter opened<span class="hint">times the envelope was tapped open</span></span><span class="num" id="opened">–</span></div>
    <div class="row"><span class="label">"I'm ready to talk"<span class="hint">times this button was pressed</span></span><span class="num" id="ready">–</span></div>
    <div class="row"><span class="label">"Not yet"<span class="hint">times this button was pressed</span></span><span class="num" id="notyet">–</span></div>
  </div>
  <div class="foot">
    <p class="status" id="status">Loading…</p>
    <button type="button" id="refresh">Refresh</button>
  </div>
</main>
<script>
// Must match COUNTER.namespace in index.html
const NAMESPACE = "ll-1809d23c7eda0084";
const KEYS = ["opened", "ready", "notyet"];

async function getCount(key) {
  const res = await fetch("https://abacus.jasoncameron.dev/get/" + NAMESPACE + "/" + key, { cache: "no-store" });
  if (res.status === 404) return 0;               // never counted yet
  const data = await res.json();
  if (data.error) return 0;
  return Number(data.value) || 0;
}

async function load() {
  const status = document.getElementById("status");
  status.textContent = "Loading…";
  try {
    const values = await Promise.all(KEYS.map(getCount));
    KEYS.forEach((k, i) => { document.getElementById(k).textContent = values[i]; });
    status.textContent = "Checked " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    status.textContent = "Couldn't reach the counter. Try again in a bit.";
  }
}

document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
